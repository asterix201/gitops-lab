apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: chaos
  annotations:
    argocd.argoproj.io/hook: PreSync                      # фаза: до основного sync
    argocd.argoproj.io/hook-delete-policy: HookFailed
spec:
  backoffLimit: 0            # падаем сразу, без шести ретраев Kubernetes
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo 'migrating...'; sleep 5; exit 1"]
