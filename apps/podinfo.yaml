apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd                # Application живут в namespace Argo CD (см. разбор)
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default                 # обязательное поле; default разрешает всё
  source:
    repoURL: https://github.com/asterix201/gitops-lab.git
    targetRevision: main           # ветка / тег / полный SHA / HEAD
    path: manifests/podinfo        # путь внутри репо; тип инструмента определится сам
  destination:
    server: https://kubernetes.default.svc   # "тот кластер, где я сам живу"
    namespace: demo                # namespace по умолчанию для namespaced-ресурсов
  # syncPolicy:
  #   syncOptions:
  #     - CreateNamespace=true       # создать demo, если его нет
  # syncPolicy.automated намеренно ОТСУТСТВУЕТ — синкаем руками до модуля 5
  ignoreDifferences:
    - group: apps                    # apiGroup ресурса; "" для core (v1)
      kind: Deployment
      name: podinfo                  # опционально; без name — все Deployment приложения
      namespace: demo                # опционально
      managedFieldsManagers:         # игнорировать всё, чем владеет этот field manager
        - kube-controller-manager
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true   # <-- КРИТИЧНО, см. ниже
    automated:
      enabled: true       # явный вкл/выкл — удобный kill switch, см. 5.5
      prune: true         # удалять ресурсы, которых больше нет в Git
      selfHeal: true      # откатывать изменения, сделанные в кластере
      allowEmpty: false   # предохранитель: не сносить всё, если рендер дал пусто
