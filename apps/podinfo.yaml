apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd                # Application живут в namespace Argo CD (см. разбор)
spec:
  project: default                 # обязательное поле; default разрешает всё
  source:
    repoURL: https://github.com/asterix201/gitops-lab.git
    targetRevision: main           # ветка / тег / полный SHA / HEAD
    path: manifests/podinfo        # путь внутри репо; тип инструмента определится сам
  destination:
    server: https://kubernetes.default.svc   # "тот кластер, где я сам живу"
    namespace: demo                # namespace по умолчанию для namespaced-ресурсов
  syncPolicy:
    syncOptions:
      - CreateNamespace=true       # создать demo, если его нет
  # syncPolicy.automated намеренно ОТСУТСТВУЕТ — синкаем руками до модуля 5
